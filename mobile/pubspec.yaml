name: azmara_preview
description: Independent, locally bundled AZMARA iPhone design prototype.
publish_to: none
version: 0.1.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: 4.9.0
  webview_flutter_wkwebview: 3.26.0
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/game/
    - assets/game/assets/
    - assets/game/assets/progression/
    - assets/game/assets/land/
    - assets/game/assets/valley-wall/
