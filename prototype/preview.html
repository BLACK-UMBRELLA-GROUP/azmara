<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#252922">
    <title>AZMARA — Design review</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #efe5cc; background: #20251f; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; }
      .review-header { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; border-bottom: 1px solid #b49a6240; background: #282c24; }
      h1 { margin: 0 0 5px; font: 20px Georgia, serif; letter-spacing: .15em; }
      .subtitle { margin: 0; color: #c1bcae; font-size: 12px; }
      .view-controls { display: flex; gap: 4px; padding: 4px; border: 1px solid #827255; border-radius: 10px; }
      button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 6px; background: transparent; color: #e6dcc5; font: inherit; font-size: 14px; cursor: pointer; }
      button[aria-pressed="true"] { color: #302b23; background: #e7d8b9; }
      button:focus-visible { outline: 3px solid #7db4a3; outline-offset: 3px; }
      .stage { display: flex; align-items: flex-start; justify-content: center; min-height: calc(100dvh - 76px); padding: 24px; }
      .frame { position: relative; background: #171b16; border: 8px solid #10150f; border-radius: 28px; overflow: hidden; box-shadow: 0 18px 70px #0006; }
      iframe { display: block; width: 390px; max-width: calc(100vw - 64px); height: 844px; border: 0; background: #292822; }
      .stage[data-view="desktop"] { padding: 12px; }
      .stage[data-view="desktop"] .frame { width: 100%; border: 1px solid #827255; border-radius: 8px; }
      .stage[data-view="desktop"] iframe { width: 100%; max-width: none; height: max(420px, calc(100dvh - 102px)); }
      @media (max-width: 600px) {
        .review-header { padding: 12px; flex-wrap: wrap; }
        .stage { padding: 16px 8px; }
        iframe { max-width: calc(100vw - 32px); }
        .subtitle { max-width: 240px; line-height: 1.5; }
      }
      @media (prefers-reduced-motion: no-preference) { button { transition: background 120ms; } }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
      <defs>
        <symbol id="icon-caravan" viewBox="0 0 24 24"><path d="M2 12l3 2h12l2-3 1-5 3 1-1 2-2 1-1 5H5l-3-3M6 15v6M10 15l-1 6M16 15v6M19 14l2 7M6 13V9h9v4M9 9V6h4v3M3 21h18"/></symbol>
        <symbol id="icon-convoy" viewBox="0 0 24 24"><path d="M3 16h18M5 16V9a7 7 0 0 1 14 0v7M5 10h14M8 5v11M12 2v14M16 5v11M19 12h3v4M8 20h8"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></symbol>
      </defs>
    </svg>
    <header class="review-header">
      <div><h1>AZMARA</h1><p class="subtitle">Design review · one prototype, two layouts</p></div>
      <nav class="view-controls" aria-label="Preview layout">
        <button type="button" data-view="phone" aria-pressed="true">Phone</button>
        <button type="button" data-view="desktop" aria-pressed="false">Desktop</button>
      </nav>
    </header>
    <main class="stage" data-view="phone" aria-label="Interactive town preview">
      <div class="frame"><iframe src="./index.html?v=20261014-appearance-modal-web26" title="AZMARA interactive town prototype"></iframe></div>
    </main>
    <script>
      const stage = document.querySelector('.stage');
      const buttons = [...document.querySelectorAll('button[data-view]')];
      buttons.forEach(button => button.addEventListener('click', () => {
        stage.dataset.view = button.dataset.view;
        buttons.forEach(control => control.setAttribute('aria-pressed', String(control === button)));
      }));
    </script>
  </body>
</html>
